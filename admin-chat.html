let audioCtx = null;
document.addEventListener('click', () => {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
});

function beep() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = 880;
  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.4);
}

function notifyNewMessage(name, text) {
  beep();
  if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
    new Notification('New message from ' + name, { body: text });
  }
}

// ---------- Chat list ----------
function loadChatList() {
  const prevTimes = {};
  let firstLoad = true;
  stopList = onValue(ref(db, 'chatMeta'), (snap) => {
    const box = $('list-items');
    box.innerHTML = '';
    const items = [];
    snap.forEach((c) => { items.push({ id: c.key, meta: c.val() || {} }); });
    items.sort((a, b) => (b.meta.lastTime || 0) - (a.meta.lastTime || 0));

    let unread = 0;
    items.forEach(({ id, meta }) => {
      if (meta.unreadAdmin) unread++;
      const isNew = !firstLoad && meta.unreadAdmin && (meta.lastTime || 0) > (prevTimes[id] || 0);
      if (isNew) notifyNewMessage(meta.name || id.slice(0, 8), meta.lastMessage || '');
      prevTimes[id] = meta.lastTime || 0;

      const el = document.createElement('div');
      el.className = 'chat-item' + (meta.unreadAdmin ? ' unread' : '') + (id === currentChat ? ' active' : '');
      el.innerHTML = '<div class="name"></div><div class="last"></div>';
      el.querySelector('.name').textContent = meta.name || id.slice(0, 8);
      el.querySelector('.last').textContent = meta.lastMessage || '';
      el.onclick = () => openChat(id, meta.name || id.slice(0, 8));
      box.appendChild(el);
    });

    document.title = unread > 0 ? '(' + unread + ') Admin Chat Panel' : 'Admin Chat Panel';
    firstLoad = false;
  }, (err) => console.error('Chat list load failed:', err.code));
}

// ---------- Open chat ----------
function openChat(id, name) {
  if (stopMessages) stopMessages();
  currentChat = id;
  $('chat-title').textContent = name;
  $('reply-bar').style.display = 'flex';
  $('messages').innerHTML = '';
  update(ref(db, 'chatMeta/' + id), { unreadAdmin: false });
  stopMessages = onChildAdded(ref(db, 'chats/' + id + '/messages'), (snap) => {
    const m = snap.val();
    const b = document.createElement('div');
    b.className = 'bubble ' + (m.sender === 'admin' ? 'admin' : 'user');
    if (m.image && String(m.image).startsWith('data:image/')) {
      const img = document.createElement('img');
      img.src = m.image;
      b.appendChild(img);
    } else {
      b.textContent = m.text || '';
    }
    $('messages').appendChild(b);
    $('messages').scrollTop = $('messages').scrollHeight;
    if (m.sender === 'user' && !document.hidden) {
      update(ref(db, 'chatMeta/' + id), { unreadAdmin: false });
    }
  });
}

  } catch (e) {
    console.error('Send failed:', e);
  }
}

// ---------- Send image ----------
function compressImage(file, maxSize = 800, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = img.width * scale; c.height = img.height * scale;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ---------- small modal helper ----------
function makeOrderModal() {
  const overlay = document.createElement('div'); overlay.className = 'ord-overlay';

  const head = document.createElement('div'); head.className = 'ord-head';
  const title = document.createElement('span');

  head.append(title, closeBtn);
  const body = document.createElement('div'); body.className = 'ord-body';
  const foot = document.createElement('div'); foot.className = 'ord-foot';
  box.append(head, body, foot);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  const close = () => { overlay.style.display = 'none'; };
  closeBtn.onclick = close;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  return { overlay, title, body, foot, close, open: () => { overlay.style.display = 'flex'; } };
}

    Object.keys(o).forEach((k) => rows.push({ uid: uid, key: k, ...o[k] }));
  });
  const rank = { Confirmed: 0, Pending: 1, Shipped: 2 };
  rows.sort((a, b) => ((rank[a.status] ?? 3) - (rank[b.status] ?? 3)) || ((b.time || 0) - (a.time || 0)));
  if (!rows.length) { ordersModal.body.textContent = 'No orders yet.'; return; }

  rows.forEach((r) => {
    const row = document.createElement('div'); row.className = 'ord-row';
    const info = document.createElement('div'); info.style.flex = '1';
    const t = document.createElement('div');
    t.style.fontWeight = 'bold';
    t.textContent = r.title || ('#' + r.id);
    const s = document.createElement('div');
    s.style.color = '#64748b'; s.style.fontSize = '12px';
    const pay = ((r.originalPrice || 0) * 0.70).toFixed(2);
    s.textContent = (chatNames[r.uid] || r.uid.slice(0, 8)) + '  •  customer pays $' + pay +
      (r.time ? '  •  ' + new Date(r.time).toLocaleString() : '');
    info.append(t, s);

    const st = document.createElement('span');
    st.className = 'ord-status';
    st.textContent = r.status || '';
    st.style.color = r.status === 'Confirmed' ? '#16a34a' : (r.status === 'Shipped' ? '#2563eb' : '#94a3b8');
    row.append(info, st);

    if (r.status === 'Confirmed') {
      const b = document.createElement('button');
      b.className = 'ord-btn small'; b.textContent = 'Mark Shipped';
      b.onclick = () => {
        update(ref(db), { ['assignedOrders/' + r.uid + '/' + r.key + '/status']: 'Shipped' })
          .catch((e) => { console.error(e); alert('Update failed'); });
      };
      row.appendChild(b);
    }
    if (r.status === 'Pending') {
      const b = document.createElement('button');
      b.className = 'ord-btn small gray'; b.textContent = 'Remove';
      b.onclick = () => {
        if (confirm('Remove this pending order?')) setOrderValue(r.uid, r.key, null);
      };
      row.appendChild(b);
    }
    ordersModal.body.appendChild(row);
  });
}

ordersBtn.onclick = () => { renderOrdersList(); ordersModal.open(); };

onAuthStateChanged(auth, (user) => {
  if (stopOrdersWatch) { stopOrdersWatch(); stopOrdersWatch = null; }
  if (stopNamesWatch) { stopNamesWatch(); stopNamesWatch = null; }
  allOrders = {}; chatNames = {};
  ordersFirstLoad = true; lastConfirmedCount = 0;
  refreshOrdersBtn();
  if (!user || user.uid !== ADMIN_UID) return;

  stopNamesWatch = onValue(ref(db, 'chatMeta'), (snap) => {
    const n = {};
    snap.forEach((c) => { n[c.key] = (c.val() || {}).name || c.key.slice(0, 8); });
    chatNames = n;
    if (ordersModal.overlay.style.display === 'flex') renderOrdersList();
  }, (err) => console.error('Names load failed:', err.code));

  stopOrdersWatch = onValue(ref(db, 'assignedOrders'), (snap) => {
    allOrders = snap.val() || {};
    const confirmed = countConfirmed();
    if (!ordersFirstLoad && confirmed > lastConfirmedCount) beep();
    lastConfirmedCount = confirmed;
    ordersFirstLoad = false;
    refreshOrdersBtn();
    if (ordersModal.overlay.style.display === 'flex') renderOrdersList();
  }, (err) => console.error('Orders load failed:', err.code));
});

//  SEND PRODUCTS PANEL  (admin-chat.html এর <script type="module">
// =====================================================================

const spStyle = document.createElement('style');
spStyle.textContent = `
.sp-open{display:block;width:calc(100% - 20px);margin:10px;padding:11px;background:#ff5722;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:14px;}
.sp-to{padding:10px;border:1px solid #fed7c7;border-radius:8px;background:#fff7f3;margin-bottom:10px;}
.sp-to-label{font-size:12px;color:#64748b;margin-bottom:4px;}
.sp-chosen{font-weight:bold;font-size:14px;color:#ff5722;word-break:break-all;margin-bottom:6px;}
.sp-results{display:none;max-height:180px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:6px;margin-top:6px;background:#fff;}
.sp-item{padding:7px 10px;border-bottom:1px solid #f1f5f9;cursor:pointer;font-size:12px;}
.sp-item:hover{background:#fff3ee;}
.sp-item b{font-size:13px;word-break:break-all;}
.sp-thumb{width:38px;height:38px;object-fit:cover;border-radius:6px;background:#f1f5f9;flex-shrink:0;}
`;
document.head.appendChild(spStyle);

const spModal = makeOrderModal();
spModal.title.textContent = 'Send products to customer';

let spCustomers = [];
let spChosen = null;            // { uid, label, customerId }
let spStopCustomers = null;
const spSelected = new Set();

// ---------- UI elements ----------
const spTo = document.createElement('div'); spTo.className = 'sp-to';
const spToLabel = document.createElement('div'); spToLabel.className = 'sp-to-label'; spToLabel.textContent = 'Send to:';
const spChosenText = document.createElement('div'); spChosenText.className = 'sp-chosen';
const spCustInput = document.createElement('input');
spCustInput.className = 'ord-search';
spCustInput.style.marginBottom = '0';
spCustInput.placeholder = '🔎 Search customer: ID / email / shop name...';
const spCustResults = document.createElement('div'); spCustResults.className = 'sp-results';
spTo.append(spToLabel, spChosenText, spCustInput, spCustResults);

const spProdSearch = document.createElement('input');
spProdSearch.className = 'ord-search';
spProdSearch.placeholder = 'Search product name or ID...';
const spProdList = document.createElement('div');

const spCount = document.createElement('span');
const spSendBtn = document.createElement('button');
spSendBtn.className = 'ord-btn';
spSendBtn.textContent = 'Send to customer';

spModal.body.append(spTo, spProdSearch, spProdList);
spModal.foot.append(spCount, spSendBtn);

// ---------- customer picker ----------
function spFindCustomers() {
  const q = spCustInput.value.trim().toLowerCase();
  return spCustomers.filter((c) =>
    !q || [c.customerId, c.email, c.shopName, c.ownerName].some((v) => String(v || '').toLowerCase().includes(q))
  );
}

function spRefreshChosen() {
  spChosenText.textContent = spChosen
    ? '✅ ' + spChosen.label + (spChosen.customerId ? '  (ID ' + spChosen.customerId + ')' : '')
    : 'No customer selected — search below';
}

function spRenderCustomers() {
  spCustResults.innerHTML = '';
  spCustResults.style.display = 'block';
  const matches = spFindCustomers();
  if (!matches.length) {
    const e = document.createElement('div');
    e.className = 'sp-item'; e.style.color = '#94a3b8';
    e.textContent = spCustomers.length ? 'No customer found' : 'No customers loaded';
    spCustResults.appendChild(e);
    return matches;
  }
  matches.slice(0, 100).forEach((c) => {
    const item = document.createElement('div'); item.className = 'sp-item';
    const b = document.createElement('b'); b.textContent = c.email || c.uid;
    const s = document.createElement('div'); s.style.color = '#64748b';
    s.textContent = 'ID ' + (c.customerId || '-') + (c.shopName ? '  •  ' + c.shopName : '');
    item.append(b, s);
    item.onclick = () => {
      spChosen = { uid: c.uid, label: c.email || String(c.customerId || c.uid), customerId: c.customerId };
      spCustInput.value = '';
      spCustResults.style.display = 'none';
      spRefreshChosen();
    };
    spCustResults.appendChild(item);
  });
  return matches;
}
spCustInput.addEventListener('focus', spRenderCustomers);
spCustInput.addEventListener('input', spRenderCustomers);
spCustInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const m = spFindCustomers();
    if (m.length) {
      const c = m[0];
      spChosen = { uid: c.uid, label: c.email || String(c.customerId || c.uid), customerId: c.customerId };
      spCustInput.value = '';
      spCustResults.style.display = 'none';
      spRefreshChosen();
    }
  }
});

// ---------- product list ----------
function spRenderProducts() {
  const q = spProdSearch.value.trim().toLowerCase();
  spProdList.innerHTML = '';
  ORDER_PRODUCTS
    .filter((p) => !q || p.title.toLowerCase().includes(q) || String(p.id) === q)
    .forEach((p) => {
      const row = document.createElement('div'); row.className = 'ord-row';
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.id = 'spp-' + p.id; cb.checked = spSelected.has(p.id);
      cb.onchange = () => {
        if (cb.checked) spSelected.add(p.id); else spSelected.delete(p.id);
        spCount.textContent = spSelected.size + ' selected';
      };
      const im = document.createElement('img');
      im.className = 'sp-thumb'; im.src = p.img;
      im.onerror = () => { im.style.visibility = 'hidden'; };
      const lb = document.createElement('label');
      lb.htmlFor = cb.id;
      lb.textContent = '#' + p.id + '  ' + p.title + (p.free ? '  (Free)' : '');
      const pr = document.createElement('span');
      pr.className = 'ord-price';
      pr.textContent = '$' + p.originalPrice.toFixed(2);
      row.append(cb, im, lb, pr);
      spProdList.appendChild(row);
    });
  spCount.textContent = spSelected.size + ' selected';
}
spProdSearch.addEventListener('input', spRenderProducts);

// ---------- open button (All Chats হেডারের নিচে) ----------
const spOpenBtn = document.createElement('button');
spOpenBtn.className = 'sp-open';
spOpenBtn.textContent = '🛒 Send Products to Customer';
const spListHead = document.querySelector('#chat-list h3');
spListHead.parentNode.insertBefore(spOpenBtn, spListHead.nextSibling);

spOpenBtn.onclick = () => {
  spSelected.clear();
  spProdSearch.value = '';
  spCustInput.value = '';
  spCustResults.style.display = 'none';
  // কোনো চ্যাট খোলা থাকলে সেই গ্রাহককে আগেই বেছে দেওয়া হবে
  if (currentChat) {
    const c = spCustomers.find((x) => x.uid === currentChat);
    spChosen = c
      ? { uid: c.uid, label: c.email || String(c.customerId || c.uid), customerId: c.customerId }
      : { uid: currentChat, label: $('chat-title').textContent };
  } else {
    spChosen = null;
  }
  spRefreshChosen();
  spRenderProducts();
  spModal.open();
};

// ---------- send ----------
spSendBtn.onclick = async () => {
  if (!spChosen) { alert('Select a customer first'); return; }
  if (spSelected.size === 0) { alert('Select at least one product'); return; }
  const uid = spChosen.uid;
  const items = ORDER_PRODUCTS.filter((p) => spSelected.has(p.id));
  if (!confirm('Send ' + items.length + ' product(s) to ' + spChosen.label + '?')) return;
  spSendBtn.disabled = true;
  try {
    const now = Date.now();
    const updates = {};
    items.forEach((p) => {
      const key = push(ref(db, 'assignedOrders/' + uid)).key;
      updates['assignedOrders/' + uid + '/' + key] = {
        id: p.id, title: p.title, originalPrice: p.originalPrice,
        img: p.img, free: p.free, status: 'Pending', time: now
      };
    });
    await update(ref(db), updates);
    spSelected.clear();
    spModal.close();
    alert('Sent ' + items.length + ' product(s) to ' + spChosen.label);
  } catch (e) {
    console.error('Send products failed:', e);
    alert('Failed to send');
  }
  spSendBtn.disabled = false;
};

// ---------- load all registered customers ----------
onAuthStateChanged(auth, (user) => {
  if (spStopCustomers) { spStopCustomers(); spStopCustomers = null; }
  spCustomers = [];
  if (!user || user.uid !== ADMIN_UID) return;
  spStopCustomers = onValue(ref(db, 'customers'), (snap) => {
    const arr = [];
    snap.forEach((c) => { arr.push({ uid: c.key, ...(c.val() || {}) }); });
    arr.sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
    spCustomers = arr;
    if (spCustResults.style.display === 'block') spRenderCustomers();
  }, (err) => console.error('Customers load failed:', err.code));
});
</script>

<script type="module">
import { getApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import { getDatabase, ref, get, runTransaction, push, set, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

const db = getDatabase(getApp());
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

// Add Balance বাটনকে Send Products বাটনের নিচে বসানো
(function placeBalanceButton() {
  const btn = $("balOpenBtn");
  let tries = 0;
  const timer = setInterval(() => {
    tries++;
    const target = [...document.querySelectorAll("button")]
      .find(b => b !== btn && b.textContent.includes("Send Products to Customer"));
    if (target) {
      btn.className = target.className;
      btn.style.cssText = target.style.cssText;
      btn.style.marginTop = "10px";
      target.insertAdjacentElement("afterend", btn);
      clearInterval(timer);
    } else if (tries > 20) {
      Object.assign(btn.style, {position:"fixed", right:"16px", bottom:"16px", zIndex:"9998",
        background:"#ff5722", color:"#fff", border:"0", borderRadius:"12px",
        padding:"12px 18px", fontWeight:"700", cursor:"pointer"});
      clearInterval(timer);
    }
  }, 250);
})();

let customers = [];
let selected = null;

async function loadCustomers() {
  const snap = await get(ref(db, "customers"));
  customers = snap.exists()
    ? Object.entries(snap.val()).map(([uid, c]) => ({ uid, ...c }))
    : [];
}

function renderList() {
  const q = $("balSearch").value.trim().toLowerCase();
  const rows = customers.filter(c =>
    !q ||
    String(c.customerId || "").includes(q) ||
    (c.email || "").toLowerCase().includes(q) ||
    (c.shopName || "").toLowerCase().includes(q) ||
    (c.ownerName || "").toLowerCase().includes(q)
  ).slice(0, 50);

  const box = $("balList");
  box.style.display = "block";
  box.innerHTML = rows.length
    ? rows.map(c => `<div class="bal-item" data-uid="${esc(c.uid)}">
        <b>${esc(c.email)}</b> (ID ${esc(c.customerId)})<br>
        <span style="color:#777">${esc(c.shopName || "")} ${c.ownerName ? "• " + esc(c.ownerName) : ""}</span></div>`).join("")
    : `<div class="bal-item" style="cursor:default;color:#999">কোনো গ্রাহক পাওয়া যায়নি</div>`;
}

function selectCustomer(uid) {
  selected = customers.find(c => c.uid === uid) || null;
  if (!selected) return;
  $("balSelected").innerHTML = `✅ ${esc(selected.email)} (ID ${esc(selected.customerId)})`;
  $("balList").style.display = "none";
  $("balSearch").value = "";
}

$("balOpenBtn").onclick = async () => {
  $("balOverlay").classList.add("show");
  $("balMsg").textContent = "";
  try { await loadCustomers(); } catch (e) {
    $("balMsg").style.color = "red"; $("balMsg").textContent = "গ্রাহকের তালিকা লোড হয়নি: " + e.message;
  }
};
$("balClose").onclick = () => $("balOverlay").classList.remove("show");
$("balOverlay").addEventListener("click", e => { if (e.target.id === "balOverlay") $("balOverlay").classList.remove("show"); });

$("balSearch").addEventListener("focus", renderList);
$("balSearch").addEventListener("input", renderList);
$("balList").addEventListener("click", e => {
  const item = e.target.closest(".bal-item[data-uid]");
  if (item) selectCustomer(item.dataset.uid);
});
document.querySelectorAll(".bal-quick button").forEach(b =>
  b.onclick = () => { $("balAmount").value = b.dataset.amt; });

$("balSubmit").onclick = async () => {
  const msg = $("balMsg");
  const amount = parseFloat($("balAmount").value);
  if (!selected) { msg.style.color = "red"; msg.textContent = "আগে একজন গ্রাহক বাছাই করুন"; return; }
  if (isNaN(amount) || amount <= 0) { msg.style.color = "red"; msg.textContent = "সঠিক Amount দিন"; return; }

  $("balSubmit").disabled = true;
  msg.style.color = "#555"; msg.textContent = "অপেক্ষা করুন...";
  try {
    const res = await runTransaction(ref(db, "balances/" + selected.uid), cur =>
      Math.round(((Number(cur) || 0) + amount) * 100) / 100);
    await set(push(ref(db, "balanceLogs/" + selected.uid)), { amount, at: serverTimestamp() });

    msg.style.color = "green";
    msg.textContent = `✅ $${amount.toFixed(2)} যোগ হয়েছে। নতুন ব্যালেন্স: $${res.snapshot.val().toFixed(2)}`;
    $("balAmount").value = "";
  } catch (e) {
    msg.style.color = "red"; msg.textContent = "Error: " + e.message;
  }
  $("balSubmit").disabled = false;
};
</script>
