<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Chat Panel</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: sans-serif; background:#f1f5f9; height:100vh; }
  #login-box { max-width:320px; margin:15vh auto; background:#fff; padding:25px; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,.1); display:flex; flex-direction:column; gap:10px; }
  #login-box h3 { margin:0 0 5px; color:#ff5722; }
  #login-box input { padding:10px; border:1px solid #cbd5e1; border-radius:6px; }
  #login-box button, #reply-bar button.send { background:#ff5722; color:#fff; border:none; padding:10px 16px; border-radius:6px; cursor:pointer; font-weight:bold; }
  #login-error { color:#dc2626; font-size:13px; }
  #panel { display:none; height:100vh; }
  #chat-list { width:300px; background:#fff; border-right:1px solid #e2e8f0; overflow-y:auto; }
  #chat-list h3 { margin:0; padding:15px; background:#ff5722; color:#fff; display:flex; justify-content:space-between; align-items:center; }
  #chat-list h3 button { background:#fff; color:#ff5722; border:none; border-radius:4px; padding:4px 8px; cursor:pointer; font-size:12px; }
  .chat-item { padding:12px 15px; border-bottom:1px solid #f1f5f9; cursor:pointer; }
  .chat-item:hover, .chat-item.active { background:#fff3ee; }
  .chat-item .name { font-weight:bold; font-size:13px; }
  .chat-item .last { font-size:12px; color:#64748b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-item.unread .name::after { content:" ●"; color:#ff5722; }
  #chat-main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #chat-title { padding:15px; background:#fff; border-bottom:1px solid #e2e8f0; font-weight:bold; }
  #messages { flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:10px; }
  .bubble { padding:8px 12px; border-radius:8px; max-width:70%; word-break:break-word; font-size:14px; }
  .bubble.user { background:#e2e8f0; align-self:flex-start; }
  .bubble.admin { background:#ff5722; color:#fff; align-self:flex-end; }
  .bubble img { max-width:100%; border-radius:6px; display:block; }
  #reply-bar { display:none; gap:8px; padding:10px; background:#fff; border-top:1px solid #e2e8f0; }
  #reply-bar input[type=text] { flex:1; padding:10px; border:1px solid #cbd5e1; border-radius:6px; }
  #reply-bar button.attach { background:#f1f5f9; border:1px solid #cbd5e1; padding:10px; border-radius:6px; cursor:pointer; }
</style>
</head>
<body>

<div id="login-box">
  <h3>Admin Login</h3>
  <input type="email" id="adm-email" placeholder="Email">
  <input type="password" id="adm-pass" placeholder="Password">
  <button id="login-btn">Login</button>
  <div id="login-error"></div>
</div>

<div id="panel">
  <div id="chat-list">
    <h3>All Chats <button id="logout-btn">Logout</button></h3>
    <div id="list-items"></div>
  </div>
  <div id="chat-main">
    <div id="chat-title">Select a chat</div>
    <div id="messages"></div>
    <div id="reply-bar">
      <input type="file" id="adminFile" accept="image/*" style="display:none;">
      <button class="attach" id="attach-btn">📎</button>
      <input type="text" id="adminReplyMessage" placeholder="Type a reply...">
      <button class="send" id="send-btn">Send</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import { getDatabase, ref, push, update, onValue, onChildAdded } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

const ADMIN_UID = "rCQcxmCJKoMHdQRg04qABNGRM2o1;

const firebaseConfig = {
  apiKey: "AIzaSyBdpr3NYTRJGYKq7nL1yGc1XMW55p4nqko",
  authDomain: "self-e-shop-841f4.firebaseapp.com",
  databaseURL: "https://self-e-shop-841f4-default-rtdb.firebaseio.com",
  projectId: "self-e-shop-841f4",
  storageBucket: "self-e-shop-841f4.firebasestorage.app",
  messagingSenderId: "418069524935",
  appId: "1:418069524935:web:2ce981897086b27a88e9e2"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const $ = (id) => document.getElementById(id);
let currentChat = null;
let stopMessages = null;
let stopList = null;

// ---------- Login ----------
$('login-btn').onclick = async () => {
  $('login-error').textContent = '';
  try {
    await signInWithEmailAndPassword(auth, $('adm-email').value.trim(), $('adm-pass').value);
  } catch (e) {
    $('login-error').textContent = 'Login failed';
    console.error(e);
  }
};
$('adm-pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('login-btn').click(); });
$('logout-btn').onclick = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  if (stopList) { stopList(); stopList = null; }
  if (stopMessages) { stopMessages(); stopMessages = null; }
  currentChat = null;
  if (user && user.uid === ADMIN_UID) {
    $('login-box').style.display = 'none';
    $('panel').style.display = 'flex';
    loadChatList();
  } else {
    $('panel').style.display = 'none';
    $('login-box').style.display = 'flex';
    if (user) {
      $('login-error').textContent = 'Not an admin account';
      signOut(auth);
    }
  }
});

// ---------- Chat list ----------
function loadChatList() {
  stopList = onValue(ref(db, 'chatMeta'), (snap) => {
    const box = $('list-items');
    box.innerHTML = '';
    const items = [];
    snap.forEach((c) => { items.push({ id: c.key, meta: c.val() || {} }); });
    items.sort((a, b) => (b.meta.lastTime || 0) - (a.meta.lastTime || 0));
    items.forEach(({ id, meta }) => {
      const el = document.createElement('div');
      el.className = 'chat-item' + (meta.unreadAdmin ? ' unread' : '') + (id === currentChat ? ' active' : '');
      el.innerHTML = '<div class="name"></div><div class="last"></div>';
      el.querySelector('.name').textContent = meta.name || id.slice(0, 8);
      el.querySelector('.last').textContent = meta.lastMessage || '';
      el.onclick = () => openChat(id, meta.name || id.slice(0, 8));
      box.appendChild(el);
    });
  }, (err) => console.error('Chat list load failed:', err.code));
}

// ---------- Open chat ----------
function openChat(id, name) {
  if (stopMessages) stopMessages();
  currentChat = id;
  $('chat-title').textContent = name;
  $('reply-bar').style.display = 'flex';
  $('messages').innerHTML = '';
  update(ref(db, 'chatMeta/' + id), { unreadAdmin: false });
  stopMessages = onChildAdded(ref(db, 'chats/' + id + '/messages'), (snap) => {
    const m = snap.val();
    const b = document.createElement('div');
    b.className = 'bubble ' + (m.sender === 'admin' ? 'admin' : 'user');
    if (m.image && String(m.image).startsWith('data:image/')) {
      const img = document.createElement('img');
      img.src = m.image;
      b.appendChild(img);
    } else {
      b.textContent = m.text || '';
    }
    $('messages').appendChild(b);
    $('messages').scrollTop = $('messages').scrollHeight;
  });
}

// ---------- Send reply ----------
async function sendAdmin(data, preview) {
  if (!currentChat) return;
  const now = Date.now();
  try {
    await push(ref(db, 'chats/' + currentChat + '/messages'), { sender: 'admin', time: now, ...data });
    await update(ref(db, 'chatMeta/' + currentChat), { lastMessage: 'You: ' + preview, lastTime: now, unreadAdmin: false });
  } catch (e) {
    console.error('Send failed:', e);
  }
}

$('send-btn').onclick = () => {
  const text = $('adminReplyMessage').value.trim();
  if (!text) return;
  $('adminReplyMessage').value = '';
  sendAdmin({ text: text }, text);
};
$('adminReplyMessage').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('send-btn').click(); });

// ---------- Send image ----------
function compressImage(file, maxSize = 800, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = img.width * scale; c.height = img.height * scale;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
$('attach-btn').onclick = () => $('adminFile').click();
$('adminFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try { sendAdmin({ image: await compressImage(file) }, '📷 Photo'); }
  catch (err) { console.error('Image read failed:', err); }
});
</script>
</body>
</html>
