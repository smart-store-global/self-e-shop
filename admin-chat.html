<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Chat Panel</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: sans-serif; background:#f1f5f9; height:100vh; }
  #login-box { max-width:320px; margin:15vh auto; background:#fff; padding:25px; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,.1); display:flex; flex-direction:column; gap:10px; }
  #login-box h3 { margin:0 0 5px; color:#ff5722; }
  #login-box input { padding:10px; border:1px solid #cbd5e1; border-radius:6px; }
  #login-box button, #reply-bar button.send { background:#ff5722; color:#fff; border:none; padding:10px 16px; border-radius:6px; cursor:pointer; font-weight:bold; }
  #login-error { color:#dc2626; font-size:13px; }
  #panel { display:none; height:100vh; }
  #chat-list { width:300px; background:#fff; border-right:1px solid #e2e8f0; overflow-y:auto; }
  #chat-list h3 { margin:0; padding:15px; background:#ff5722; color:#fff; display:flex; justify-content:space-between; align-items:center; }
  #chat-list h3 button { background:#fff; color:#ff5722; border:none; border-radius:4px; padding:4px 8px; cursor:pointer; font-size:12px; }
  .chat-item { padding:12px 15px; border-bottom:1px solid #f1f5f9; cursor:pointer; }
  .chat-item:hover, .chat-item.active { background:#fff3ee; }
  .chat-item .name { font-weight:bold; font-size:13px; }
  .chat-item .last { font-size:12px; color:#64748b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-item.unread .name::after { content:" ●"; color:#ff5722; }
  #chat-main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #chat-title { padding:15px; background:#fff; border-bottom:1px solid #e2e8f0; font-weight:bold; }
  #messages { flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:10px; }
  .bubble { padding:8px 12px; border-radius:8px; max-width:70%; word-break:break-word; font-size:14px; }
  .bubble.user { background:#e2e8f0; align-self:flex-start; }
  .bubble.admin { background:#ff5722; color:#fff; align-self:flex-end; }
  .bubble img { max-width:100%; border-radius:6px; display:block; }
  #reply-bar { display:none; gap:8px; padding:10px; background:#fff; border-top:1px solid #e2e8f0; }
  #reply-bar input[type=text] { flex:1; padding:10px; border:1px solid #cbd5e1; border-radius:6px; }
  #reply-bar button.attach { background:#f1f5f9; border:1px solid #cbd5e1; padding:10px; border-radius:6px; cursor:pointer; }
</style>
</head>
<body>

<div id="login-box">
  <h3>Admin Login</h3>
  <input type="email" id="adm-email" placeholder="Email">
  <input type="password" id="adm-pass" placeholder="Password">
  <button id="login-btn">Login</button>
  <div id="login-error"></div>
</div>

<div id="id-bar" style="padding:10px 12px; background:#fff; border-bottom:1px solid #e2e8f0; display:flex; gap:8px; align-items:center;">
  <b style="white-space:nowrap;">গ্রাহক আইডি:</b>
  <div style="position:relative; flex:1; max-width:460px;">
    <input id="customerIdInput" type="text" autocomplete="off"
           placeholder="ক্লিক করে লিস্ট দেখুন, অথবা কাস্টমার আইডি/ইমেইল লিখুন"
           style="width:100%; padding:8px; box-sizing:border-box;">
    <div id="customer-dropdown"
         style="display:none; position:absolute; top:100%; left:0; right:0; max-height:260px; overflow:auto; background:#fff; border:1px solid #cbd5e1; border-radius:0 0 6px 6px; z-index:100; box-shadow:0 4px 10px rgba(0,0,0,.1);"></div>
  </div>
  <button id="id-go-btn" style="background:#ff5722; color:#fff; border:none; padding:8px 14px; border-radius:4px; cursor:pointer;">Open</button>
</div>

<div id="panel">
  <div id="chat-list">
    <h3>All Chats <button id="logout-btn">Logout</button></h3>
    <div id="list-items"></div>
  </div>
  <div id="chat-main">
    <div id="chat-title">Select a chat</div>
  <!-- এখানে অর্ডার বার বসান -->
  <div id="order-bar" style="display:none; padding:8px 12px; background:#fff; border-bottom:1px solid #e2e8f0; gap:8px; align-items:center;">
    <select id="adminProductSelect" style="flex:1; padding:6px;">
      <option value="">-- Choose a Product to Order --</option>
    </select>
    <button onclick="adminPushOrder()" style="background:#ff5722; color:#fff; border:none; padding:7px 12px; border-radius:4px; cursor:pointer;">
      Force Dispatch Order
    </button>
  </div>
  <div id="messages"></div>
  <div id="reply-bar">
    <input type="file" id="adminFile" accept="image/*" style="display:none;">
    <button class="attach" id="attach-btn">📎</button>
    <input type="text" id="adminReplyMessage" placeholder="Type a reply...">
    <button class="send" id="send-btn">Send</button>
  </div>
</div>
    <div id="messages"></div>
    <div id="reply-bar">
      <input type="file" id="adminFile" accept="image/*" style="display:none;">
      <button class="attach" id="attach-btn">📎</button>
      <input type="text" id="adminReplyMessage" placeholder="Type a reply...">
      <button class="send" id="send-btn">Send</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
  import { getDatabase, ref, push, update, onValue, onChildAdded, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
  import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-storage.js";

  // ===== Firebase Console > Project settings থেকে আসল মান বসান =====
  const firebaseConfig = {
    apiKey: "AIzaSyBdpr3NYTRJGYKq7nL1yGc1XMW55p4nqko",
    authDomain: "self-e-shop-841f4.firebaseapp.com",
    databaseURL: "https://self-e-shop-841f4-default-rtdb.firebaseio.com",
    projectId: "self-e-shop-841f4",
    storageBucket: "self-e-shop-841f4.firebasestorage.app",
    appId: "1:418069524935:web:2ce981897086b27a88e9e2",
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);
  const storage = getStorage(app);

  // ===== ভ্যারিয়েবল (সবার উপরে) =====
  let selectedClientId = null;   // নির্বাচিত গ্রাহকের Firebase uid
  let chatListener = null;
  let chatsCache = {};
  let listStarted = false;

  const productsData = [
    { id: 1, title: "Product One", inStock: true },
    { id: 2, title: "Product Two", inStock: false }
    // আপনার প্রোডাক্টগুলো এখানে দিন
  ];

  const $ = (id) => document.getElementById(id);

  // গ্রাহকের তথ্য থেকে দেখানোর নাম (কাস্টমার আইডি + ইমেইল)
  function labelOf(uid) {
    const info = (chatsCache[uid] && chatsCache[uid].info) || {};
    return (info.shopId ? "#" + info.shopId + " | " : "") + (info.email || uid);
  }

  // ===== প্রোডাক্ট সিলেক্ট (শুধু স্টকে থাকাগুলো) =====
  function loadProductSelect() {
    const sel = $("adminProductSelect");
    sel.innerHTML = '<option value="">-- Choose a Product to Order --</option>';
    productsData.filter(p => p.inStock).forEach(p => {
      const opt = document.createElement("option");
      opt.value = p.id;
      opt.textContent = p.title;
      sel.appendChild(opt);
    });
  }
  loadProductSelect();

  // ===== বাম পাশের গ্রাহক তালিকা =====
  function renderChatList() {
    const list = $("list-items");
    list.innerHTML = "";
    Object.keys(chatsCache).forEach((uid) => {
      const info = chatsCache[uid] && chatsCache[uid].info;
      if (!info) return;

      const item = document.createElement("div");
      item.style.cssText = "padding:10px 12px; border-bottom:1px solid #eee; cursor:pointer;";
      if (uid === selectedClientId) item.style.background = "#fff3ee";

      const name = document.createElement("div");
      name.style.fontWeight = "bold";
      name.textContent = labelOf(uid);
      const last = document.createElement("div");
      last.style.cssText = "font-size:12px; color:#64748b;";
      last.textContent = info.lastMessage || "";

      item.append(name, last);
      item.onclick = () => openChat(uid);
      list.appendChild(item);
    });
  }

  function startChatList() {
    if (listStarted) return;
    listStarted = true;
    onValue(ref(db, "chats"), (snap) => {
      chatsCache = snap.val() || {};
      renderChatList();
      if ($("customer-dropdown").style.display === "block") renderDropdown($("customerIdInput").value);
    }, (err) => {
      console.error(err);
      alert("চ্যাট তালিকা পড়া যায়নি: " + err.message);
    });
  }

  // ===== গ্রাহক আইডি ঘর + ড্রপডাউন =====
  function renderDropdown(filterText) {
    const box = $("customer-dropdown");
    const q = (filterText || "").trim().toLowerCase().replace("#", "");
    box.innerHTML = "";

    const uids = Object.keys(chatsCache).filter((uid) => {
      const info = (chatsCache[uid] && chatsCache[uid].info) || {};
      return !q
        || uid.toLowerCase().includes(q)
        || (info.email || "").toLowerCase().includes(q)
        || String(info.shopId || "").includes(q);
    });

    if (uids.length === 0) {
      const empty = document.createElement("div");
      empty.style.cssText = "padding:10px; color:#64748b; font-size:13px;";
      empty.textContent = q ? "লিস্টে নেই। পুরো আইডি লিখে Enter চাপুন।" : "কোনো গ্রাহক নেই";
      box.appendChild(empty);
    }

    uids.forEach((uid) => {
      const info = (chatsCache[uid] && chatsCache[uid].info) || {};
      const row = document.createElement("div");
      row.style.cssText = "padding:8px 10px; border-bottom:1px solid #f1f5f9; cursor:pointer;";
      row.onmouseenter = () => row.style.background = "#f8fafc";
      row.onmouseleave = () => row.style.background = "";

      const top = document.createElement("div");
      top.style.fontWeight = "bold";
      top.textContent = (info.shopId ? "#" + info.shopId + "  |  " : "") + (info.email || "(ইমেইল নেই)");
      const sub = document.createElement("div");
      sub.style.cssText = "font-size:11px; color:#64748b; word-break:break-all;";
      sub.textContent = "uid: " + uid;

      row.append(top, sub);
      row.onmousedown = (e) => { e.preventDefault(); openChat(uid); };
      box.appendChild(row);
    });

    box.style.display = "block";
  }

  function hideDropdown() { $("customer-dropdown").style.display = "none"; }

  // ঘরে লেখা কাস্টমার আইডি / ইমেইল / uid দিয়ে চ্যাট খোলা
  function openFromInput() {
    const raw = $("customerIdInput").value.trim();
    if (!raw) return alert("কাস্টমার আইডি বা ইমেইল লিখুন, অথবা লিস্ট থেকে বাছাই করুন");
    if (!auth.currentUser) return alert("আগে লগইন করুন");

    const val = raw.replace("#", "");
    const low = val.toLowerCase();

    const found = Object.keys(chatsCache).find((uid) => {
      const info = (chatsCache[uid] && chatsCache[uid].info) || {};
      return uid === val
        || String(info.shopId || "") === val
        || (info.email || "").toLowerCase() === low;
    });

    if (found) return openChat(found);

    // লিস্টে নেই, তবে পুরো uid-র মতো দেখালে সরাসরি খুলবে
    if (/^[A-Za-z0-9_-]{20,}$/.test(val)) return openChat(val);

    alert("এই আইডি বা ইমেইলের কোনো গ্রাহক পাওয়া যায়নি");
  }

  const idInput = $("customerIdInput");
  idInput.addEventListener("focus", () => renderDropdown(idInput.value));
  idInput.addEventListener("click", () => renderDropdown(idInput.value));
  idInput.addEventListener("input", () => renderDropdown(idInput.value));
  idInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { hideDropdown(); openFromInput(); }
    if (e.key === "Escape") hideDropdown();
  });
  idInput.addEventListener("blur", hideDropdown);
  $("id-go-btn").onclick = () => { hideDropdown(); openFromInput(); };

  // ===== চ্যাট খোলা (এখানেই selectedClientId বসে) =====
  function openChat(uid) {
    selectedClientId = uid;
    const label = labelOf(uid);
    $("customerIdInput").value = label;
    hideDropdown();
    $("chat-title").textContent = label;
    $("order-bar").style.display = "flex";
    $("messages").innerHTML = "";

    if (chatListener) chatListener();   // আগের চ্যাটের শ্রোতা বন্ধ
    chatListener = onChildAdded(ref(db, "chats/" + uid + "/messages"), (snap) => {
      addMessageBubble(snap.val());
    });
    renderChatList();
  }

  function addMessageBubble(m) {
    const box = $("messages");
    const mine = m.sender === "admin";

    const row = document.createElement("div");
    row.style.cssText = "display:flex; margin:6px 10px; justify-content:" + (mine ? "flex-end" : "flex-start");

    const bubble = document.createElement("div");
    bubble.style.cssText = "max-width:70%; padding:8px 12px; border-radius:10px; background:" + (mine ? "#ff5722" : "#fff") + "; color:" + (mine ? "#fff" : "#000") + ";";

    if (m.imageUrl) {
      const img = document.createElement("img");
      img.src = m.imageUrl;
      img.style.cssText = "max-width:220px; border-radius:6px; display:block;";
      bubble.appendChild(img);
    }
    if (m.text) {
      const t = document.createElement("div");
      t.textContent = m.text;
      bubble.appendChild(t);
    }
    row.appendChild(bubble);
    box.appendChild(row);
    box.scrollTop = box.scrollHeight;
  }

  // ===== অ্যাডমিন মেসেজ পাঠানো =====
  async function sendAdminMessage(imageUrl) {
    if (!selectedClientId) return alert("আগে উপরের ঘর থেকে একজন গ্রাহক বাছাই করুন");
    if (!auth.currentUser) return alert("আগে লগইন করুন");

    const input = $("adminReplyMessage");
    const text = input.value.trim();
    if (!text && !imageUrl) return;
    input.value = "";

    try {
      await push(ref(db, "chats/" + selectedClientId + "/messages"), {
        text: text || "",
        imageUrl: imageUrl || "",
        sender: "admin",
        time: serverTimestamp()
      });
      await update(ref(db, "chats/" + selectedClientId + "/info"), {
        lastMessage: "You: " + (text || "📷 ছবি"),
        lastTime: serverTimestamp()
      });
    } catch (e) {
      console.error(e);
      alert("মেসেজ যায়নি: " + e.message);
    }
  }
  $("send-btn").onclick = () => sendAdminMessage();
  $("adminReplyMessage").addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendAdminMessage();
  });

  // ===== ছবি পাঠানো =====
  $("attach-btn").onclick = () => $("adminFile").click();
  $("adminFile").onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!selectedClientId) {
      alert("আগে উপরের ঘর থেকে একজন গ্রাহক বাছাই করুন");
      e.target.value = "";
      return;
    }
    try {
      const path = "chatImages/" + selectedClientId + "/" + Date.now() + "_" + file.name;
      const snap = await uploadBytes(sRef(storage, path), file);
      const url = await getDownloadURL(snap.ref);
      await sendAdminMessage(url);
    } catch (err) {
      console.error(err);
      alert("ছবি যায়নি: " + err.message);
    }
    e.target.value = "";
  };

  // ===== অর্ডার পাঠানো =====
  async function adminPushOrder() {
    const pid = $("adminProductSelect").value;
    if (!pid) return alert("আগে একটি প্রোডাক্ট বাছাই করুন");
    if (!selectedClientId) return alert("আগে উপরের ঘর থেকে একজন গ্রাহক বাছাই করুন");
    if (!auth.currentUser) return alert("আগে লগইন করুন");

    const p = productsData.find(x => String(x.id) === String(pid));
    try {
      await push(ref(db, "orders/" + selectedClientId), {
        productId: p.id,
        title: p.title,
        status: "pending",
        time: serverTimestamp()
      });
      alert("অর্ডার পাঠানো হয়েছে ✅");
    } catch (e) {
      console.error(e);
      alert("এরর: " + e.message);
    }
  }
  window.adminPushOrder = adminPushOrder;

  // ===== লগইন বক্স =====
  function showLoginBox() {
    if ($("admin-login-overlay")) return;
    const ov = document.createElement("div");
    ov.id = "admin-login-overlay";
    ov.style.cssText = "position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:9999;";
    ov.innerHTML =
      '<div style="background:#fff; padding:24px; border-radius:8px; width:300px; display:flex; flex-direction:column; gap:10px;">' +
      '<h3 style="margin:0;">Admin Login</h3>' +
      '<input id="adm-email" type="email" placeholder="Email" style="padding:8px;">' +
      '<input id="adm-pass" type="password" placeholder="Password" style="padding:8px;">' +
      '<button id="adm-login-btn" style="background:#ff5722; color:#fff; border:none; padding:9px; border-radius:4px; cursor:pointer;">Login</button>' +
      '<div id="adm-err" style="color:#c00; font-size:13px;"></div>' +
      '</div>';
    document.body.appendChild(ov);

    $("adm-login-btn").onclick = async () => {
      try {
        await signInWithEmailAndPassword(auth, $("adm-email").value.trim(), $("adm-pass").value);
      } catch (e) {
        $("adm-err").textContent = "লগইন হয়নি: " + e.message;
      }
    };
  }

  $("logout-btn").onclick = () => signOut(auth);

  onAuthStateChanged(auth, (user) => {
    console.log("অ্যাডমিন:", user ? user.email + " | uid: " + user.uid : "লগইন নেই");
    if (user) {
      const ov = $("admin-login-overlay");
      if (ov) ov.remove();
      startChatList();
    } else {
      showLoginBox();
    }
  });
</script>
</body>
</html>
